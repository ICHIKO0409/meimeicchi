<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd6e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="めいめいっち">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="やさしいブラウザ育成ゲーム、めいめいっち。">
  <link rel="manifest" href="manifest.json">
  <title>めいめいっち</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7dc;
      --panel: #fffdf5;
      --pink: #ffd6e7;
      --pink-strong: #ff94bd;
      --mint: #c9f4df;
      --sky: #ccecff;
      --sun: #ffe28a;
      --ink: #5b4b4f;
      --muted: #8a777d;
      --shadow: 0 14px 30px rgba(123, 86, 96, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 214, 231, 0.8), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(204, 236, 255, 0.85), transparent 30%),
        linear-gradient(180deg, #fff7dc 0%, #fff0f5 100%);
      color: var(--ink);
      display: flex;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      text-align: center;
      touch-action: manipulation;
    }

    main {
      display: grid;
      gap: 14px;
      max-width: 430px;
      min-height: min(760px, 100svh - 36px);
      width: 100%;
    }

    header {
      padding-top: 4px;
    }

    h1 {
      font-size: clamp(2.3rem, 13vw, 3.4rem);
      line-height: 1;
      margin: 0;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.85);
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      margin: 8px 0 0;
    }

    .pet-area {
      align-content: center;
      background: var(--panel);
      border: 3px solid #fff;
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 12px;
      min-height: 310px;
      overflow: hidden;
      padding: 18px 16px;
      position: relative;
    }

    .pet-area::before,
    .pet-area::after {
      background: rgba(255, 226, 138, 0.55);
      border-radius: 999px;
      content: "";
      height: 110px;
      position: absolute;
      width: 110px;
    }

    .pet-area::before {
      left: -44px;
      top: -38px;
    }

    .pet-area::after {
      bottom: -48px;
      right: -36px;
    }

    .pet {
      font-size: clamp(6.8rem, 34vw, 9rem);
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .speech {
      align-self: center;
      background: #ffffff;
      border: 3px solid var(--pink);
      border-radius: 20px;
      box-shadow: 0 8px 18px rgba(123, 86, 96, 0.1);
      font-size: clamp(1.08rem, 5vw, 1.35rem);
      font-weight: 800;
      line-height: 1.4;
      margin: 0 auto;
      max-width: 300px;
      padding: 12px 16px;
      position: relative;
      z-index: 1;
    }

    .stats {
      display: grid;
      gap: 10px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(123, 86, 96, 0.08);
      padding: 10px 12px 12px;
    }

    .stat-top {
      align-items: center;
      display: flex;
      font-size: 1.05rem;
      font-weight: 900;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .meter {
      background: #f4e9e2;
      border-radius: 999px;
      height: 18px;
      overflow: hidden;
    }

    .fill {
      border-radius: inherit;
      height: 100%;
      transition: width 220ms ease;
    }

    .fill.energy {
      background: linear-gradient(90deg, #c9f4df, #75dca5);
    }

    .fill.hunger {
      background: linear-gradient(90deg, #ffe28a, #ffbd66);
    }

    .fill.mood {
      background: linear-gradient(90deg, #ffd6e7, #ff94bd);
    }

    .actions {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, 1fr);
    }

    button {
      appearance: none;
      background: #fff;
      border: 0;
      border-radius: 20px;
      box-shadow: 0 8px 0 rgba(123, 86, 96, 0.16), 0 12px 22px rgba(123, 86, 96, 0.1);
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(0.98rem, 4.6vw, 1.18rem);
      font-weight: 900;
      min-height: 78px;
      padding: 10px 6px;
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    button:active {
      box-shadow: 0 3px 0 rgba(123, 86, 96, 0.18), 0 7px 14px rgba(123, 86, 96, 0.1);
      transform: translateY(5px);
    }

    .icon {
      display: block;
      font-size: 1.9rem;
      margin-bottom: 4px;
    }

    .info {
      background: rgba(255, 255, 255, 0.7);
      border: 2px dashed rgba(255, 148, 189, 0.55);
      border-radius: 18px;
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 800;
      line-height: 1.55;
      padding: 10px 14px;
    }

    .online {
      color: #598f70;
    }

    .offline {
      color: #b06b48;
    }

    @media (max-width: 360px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .actions {
        gap: 8px;
      }

      button {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="めいめいっちのゲーム">
    <header>
      <h1>めいめいっち</h1>
      <p class="subtitle">きょうも なかよく あそぼう</p>
    </header>

    <section class="pet-area" aria-live="polite">
      <div class="pet" id="petFace" aria-label="めいめいっち">😊</div>
      <p class="speech" id="message">こんにちは。なにしてあそぶ？</p>
    </section>

    <section class="stats" aria-label="めいめいっちのようす">
      <div class="stat">
        <div class="stat-top"><span>げんき</span><span id="energyText">80</span></div>
        <div class="meter"><div class="fill energy" id="energyBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-top"><span>おなか</span><span id="hungerText">80</span></div>
        <div class="meter"><div class="fill hunger" id="hungerBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-top"><span>ごきげん</span><span id="moodText">80</span></div>
        <div class="meter"><div class="fill mood" id="moodBar"></div></div>
      </div>
    </section>

    <section class="actions" aria-label="おせわボタン">
      <button type="button" data-action="feed"><span class="icon">🍙</span>ごはん</button>
      <button type="button" data-action="play"><span class="icon">🎈</span>あそぶ</button>
      <button type="button" data-action="sleep"><span class="icon">🌙</span>ねる</button>
    </section>

    <section class="info">
      <div>iPhoneのホーム画面に追加してね。</div>
      <div id="networkState" class="online">オンラインです。オフラインでもあそべます。</div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "meimeicchi-state-v1";
    const defaultState = {
      energy: 80,
      hunger: 80,
      mood: 80,
      lastPlayed: Date.now()
    };

    const faces = {
      happy: "😊",
      hungry: "🥺",
      tired: "😴",
      sad: "😢",
      great: "🥰"
    };

    const messages = {
      feed: "もぐもぐ。おいしいね。",
      play: "きゃっきゃっ。たのしいね。",
      sleep: "すやすや。げんきになったよ。",
      hungry: "おなかが すいたよ。",
      tired: "ちょっと ねむいよ。",
      sad: "なでなで してほしいな。",
      great: "とっても うれしいよ。",
      hello: "こんにちは。なにしてあそぶ？"
    };

    const elements = {
      face: document.querySelector("#petFace"),
      message: document.querySelector("#message"),
      energyText: document.querySelector("#energyText"),
      hungerText: document.querySelector("#hungerText"),
      moodText: document.querySelector("#moodText"),
      energyBar: document.querySelector("#energyBar"),
      hungerBar: document.querySelector("#hungerBar"),
      moodBar: document.querySelector("#moodBar"),
      networkState: document.querySelector("#networkState")
    };

    let state = loadState();

    function clamp(value) {
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) {
          return { ...defaultState };
        }

        const hoursAway = Math.min(24, Math.max(0, (Date.now() - saved.lastPlayed) / 3600000));
        return {
          energy: clamp(saved.energy - hoursAway * 2),
          hunger: clamp(saved.hunger - hoursAway * 3),
          mood: clamp(saved.mood - hoursAway * 2),
          lastPlayed: Date.now()
        };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, lastPlayed: Date.now() }));
    }

    function getMood() {
      if (state.hunger < 25) return "hungry";
      if (state.energy < 25) return "tired";
      if (state.mood < 25) return "sad";
      if (state.energy > 75 && state.hunger > 75 && state.mood > 75) return "great";
      return "happy";
    }

    function render(customMessage) {
      const mood = getMood();
      elements.face.textContent = faces[mood];
      elements.message.textContent = customMessage || messages[mood] || messages.hello;

      elements.energyText.textContent = state.energy;
      elements.hungerText.textContent = state.hunger;
      elements.moodText.textContent = state.mood;
      elements.energyBar.style.width = `${state.energy}%`;
      elements.hungerBar.style.width = `${state.hunger}%`;
      elements.moodBar.style.width = `${state.mood}%`;
    }

    function doAction(action) {
      if (action === "feed") {
        state.hunger = clamp(state.hunger + 24);
        state.energy = clamp(state.energy + 4);
        state.mood = clamp(state.mood + 6);
      }

      if (action === "play") {
        state.mood = clamp(state.mood + 24);
        state.energy = clamp(state.energy - 12);
        state.hunger = clamp(state.hunger - 10);
      }

      if (action === "sleep") {
        state.energy = clamp(state.energy + 28);
        state.hunger = clamp(state.hunger - 8);
        state.mood = clamp(state.mood + 4);
      }

      saveState();
      render(messages[action]);
    }

    function updateNetworkState() {
      if (navigator.onLine) {
        elements.networkState.textContent = "オンラインです。オフラインでもあそべます。";
        elements.networkState.className = "online";
      } else {
        elements.networkState.textContent = "オフラインです。このままあそべます。";
        elements.networkState.className = "offline";
      }
    }

    document.querySelectorAll("button[data-action]").forEach((button) => {
      button.addEventListener("click", () => doAction(button.dataset.action));
    });

    window.addEventListener("online", updateNetworkState);
    window.addEventListener("offline", updateNetworkState);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }

    render(messages.hello);
    saveState();
    updateNetworkState();
  </script>
</body>
</html>
