<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe8f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="めいめいっち">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="やさしいブラウザ育成ゲーム、めいめいっち。">
  <link rel="manifest" href="manifest.json">
  <title>めいめいっち</title>
  <style>
    :root {
      color-scheme: light;
      --wall: #ffe8f3;
      --wall-dot: rgba(255, 137, 184, 0.22);
      --floor: #dff7ed;
      --rug: #fff7a8;
      --cream: #fffdf6;
      --pink: #ff8fbe;
      --pink-deep: #ef5e9d;
      --blue: #8edfff;
      --mint: #9df0bc;
      --yellow: #ffe96c;
      --ink: #4d365c;
      --muted: #806b88;
      --shadow: 0 16px 34px rgba(94, 68, 111, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      text-align: center;
      touch-action: manipulation;
    }

    main {
      background:
        radial-gradient(circle at 18px 18px, var(--wall-dot) 0 5px, transparent 6px),
        radial-gradient(circle at 46px 48px, rgba(141, 223, 255, 0.18) 0 5px, transparent 6px),
        linear-gradient(180deg, var(--wall) 0 64%, var(--floor) 64% 100%);
      background-size: 64px 64px, 64px 64px, auto;
      display: grid;
      grid-template-rows: auto minmax(380px, 1fr) auto auto;
      min-height: 100svh;
      overflow: hidden;
      padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      position: relative;
      width: 100%;
    }

    main::before {
      background:
        linear-gradient(140deg, transparent 0 48%, rgba(96, 158, 136, 0.16) 49% 51%, transparent 52%),
        linear-gradient(40deg, transparent 0 48%, rgba(96, 158, 136, 0.14) 49% 51%, transparent 52%);
      background-size: 58px 30px;
      bottom: 0;
      content: "";
      height: 36%;
      left: 0;
      opacity: 0.65;
      pointer-events: none;
      position: absolute;
      right: 0;
    }

    main::after {
      background: radial-gradient(ellipse at center, rgba(255, 247, 168, 0.94) 0 56%, transparent 57%);
      bottom: 178px;
      content: "";
      height: 88px;
      left: 50%;
      pointer-events: none;
      position: absolute;
      transform: translateX(-50%);
      width: min(78vw, 350px);
      z-index: 0;
    }

    header,
    .pet-area,
    .stats,
    .actions,
    .info,
    .sticker {
      position: relative;
      z-index: 1;
    }

    header {
      align-items: center;
      display: grid;
      gap: 6px;
      justify-items: center;
      margin: 0 auto;
      max-width: 520px;
      padding: 2px 0 10px;
      width: 100%;
    }

    h1 {
      color: var(--pink-deep);
      font-size: clamp(2rem, 10vw, 3.1rem);
      line-height: 1;
      margin: 0;
      paint-order: stroke fill;
      text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(255, 143, 190, 0.28);
      -webkit-text-stroke: 5px #fff;
      text-stroke: 5px #fff;
    }

    .subtitle {
      background: rgba(255, 255, 255, 0.86);
      border: 3px solid #fff;
      border-radius: 999px;
      box-shadow: 0 6px 14px rgba(94, 68, 111, 0.1);
      color: #7b5a8b;
      font-size: clamp(0.82rem, 3.5vw, 1rem);
      font-weight: 900;
      margin: 0;
      padding: 6px 14px;
    }

    .sticker {
      align-items: center;
      background: rgba(255, 255, 255, 0.84);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 6px 14px rgba(94, 68, 111, 0.12);
      display: flex;
      font-size: 1.28rem;
      height: 42px;
      justify-content: center;
      pointer-events: none;
      position: absolute;
      width: 42px;
    }

    .sticker.s1 { left: 18px; top: 112px; transform: rotate(-10deg); }
    .sticker.s2 { right: 20px; top: 118px; transform: rotate(12deg); }
    .sticker.s3 { left: 24px; top: 238px; transform: rotate(9deg); }
    .sticker.s4 { right: 26px; top: 238px; transform: rotate(-10deg); }
    .sticker.s5 { left: 34px; bottom: 184px; transform: rotate(-14deg); }
    .sticker.s6 { right: 38px; bottom: 186px; transform: rotate(14deg); }

    .pet-area {
      align-content: end;
      background:
        linear-gradient(#ffffff 0 0) left 9% top 12% / 94px 68px no-repeat,
        linear-gradient(#b9ecff 0 0) left calc(9% + 9px) top calc(12% + 9px) / 76px 50px no-repeat,
        radial-gradient(circle at 78% 18%, #fff8b8 0 20px, transparent 21px),
        linear-gradient(#ffffff 0 0) right 9% top 16% / 70px 82px no-repeat,
        linear-gradient(#ffd3e5 0 0) right calc(9% + 10px) top calc(16% + 12px) / 50px 54px no-repeat,
        linear-gradient(180deg, rgba(255, 255, 255, 0.46) 0 60%, rgba(255, 255, 255, 0) 61%);
      border: 0;
      border-radius: 28px;
      display: grid;
      gap: 10px;
      justify-items: center;
      margin: 0 auto;
      max-width: 540px;
      min-height: 0;
      overflow: hidden;
      padding: 18px 16px 22px;
      width: 100%;
    }

    .pet-area::before {
      background:
        linear-gradient(#b58ad5, #b58ad5) left 15% top 30% / 118px 8px no-repeat,
        radial-gradient(circle at 18% 23%, #fff7a8 0 14px, transparent 15px),
        radial-gradient(circle at 28% 23%, #ffb8d7 0 14px, transparent 15px),
        radial-gradient(circle at 38% 23%, #baf4c9 0 14px, transparent 15px),
        linear-gradient(#caa2df 0 0) left 13% top calc(30% + 8px) / 10px 72px no-repeat,
        linear-gradient(#caa2df 0 0) left calc(15% + 110px) top calc(30% + 8px) / 10px 72px no-repeat,
        radial-gradient(ellipse at center, rgba(255, 247, 168, 0.82) 0 56%, transparent 57%) center bottom 2px / 250px 58px no-repeat;
      content: "";
      inset: 0;
      opacity: 0.96;
      pointer-events: none;
      position: absolute;
    }

    .pet-area::after {
      background:
        radial-gradient(circle at 50% 18%, #fff 0 11px, transparent 12px),
        linear-gradient(#ffb3d3, #ffb3d3) center 20px / 78px 52px no-repeat,
        linear-gradient(#c79de0, #c79de0) center top / 70px 9px no-repeat,
        linear-gradient(#c79de0, #c79de0) center bottom / 92px 10px no-repeat;
      border-radius: 14px 14px 9px 9px;
      bottom: 36px;
      content: "";
      height: 78px;
      opacity: 0.82;
      position: absolute;
      right: 26px;
      width: 98px;
    }

    .stage-name {
      align-self: start;
      background: rgba(255, 255, 255, 0.92);
      border: 3px solid #e7cff4;
      border-radius: 999px;
      color: #7b5a8b;
      display: inline-block;
      font-size: 0.92rem;
      font-weight: 900;
      justify-self: center;
      padding: 6px 15px;
      position: relative;
      z-index: 1;
    }

    .pet-wrap {
      align-items: center;
      display: grid;
      justify-items: center;
      min-height: 178px;
      position: relative;
      z-index: 1;
    }

    .floaty { animation: floaty 3.2s ease-in-out infinite; }
    .bounce { animation: bounce 360ms ease; }

    .pet {
      filter: drop-shadow(0 12px 0 rgba(126, 88, 145, 0.18));
      font-size: clamp(6.6rem, 35vw, 9.6rem);
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .pet-image {
      display: none;
      image-rendering: pixelated;
      max-height: 190px;
      max-width: min(70vw, 270px);
      object-fit: contain;
    }

    .has-image .pet-image { display: block; }
    .has-image .pet { display: none; }

    .speech {
      align-self: end;
      background: rgba(255, 255, 255, 0.96);
      border: 3px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 18px rgba(94, 68, 111, 0.12);
      color: #644676;
      font-size: clamp(1rem, 4.2vw, 1.16rem);
      font-weight: 900;
      line-height: 1.36;
      margin: 0 auto;
      max-width: 330px;
      padding: 10px 14px;
      position: relative;
      z-index: 1;
    }

    .stats {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, 1fr);
      margin: 10px auto 0;
      max-width: 540px;
      width: 100%;
    }

    .stat {
      background: rgba(255, 255, 255, 0.9);
      border: 3px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 7px 16px rgba(94, 68, 111, 0.11);
      padding: 8px 8px 10px;
    }

    .stat-top {
      align-items: center;
      color: #6e507d;
      display: flex;
      font-size: clamp(0.72rem, 3.1vw, 0.9rem);
      font-weight: 900;
      justify-content: space-between;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .meter {
      background: #f0e8f7;
      border: 2px solid #fff;
      border-radius: 999px;
      height: 14px;
      overflow: hidden;
    }

    .fill {
      border-radius: inherit;
      height: 100%;
      transition: width 220ms ease;
    }

    .fill.energy { background: linear-gradient(90deg, #baf4c9, #62df92); }
    .fill.hunger { background: linear-gradient(90deg, #fff7a8, #ffd15f); }
    .fill.mood { background: linear-gradient(90deg, #ffc0dc, #ff7db6); }

    .actions {
      display: grid;
      gap: clamp(12px, 4vw, 22px);
      grid-template-columns: repeat(3, minmax(0, 1fr));
      justify-items: center;
      margin: 14px auto 0;
      max-width: 430px;
      width: 100%;
    }

    button {
      align-items: center;
      appearance: none;
      aspect-ratio: 1;
      background: radial-gradient(circle at 34% 26%, #fffdf2 0 18%, var(--yellow) 19% 68%, #ffc84f 69% 100%);
      border: 4px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 9px 18px rgba(94, 68, 111, 0.18), inset 0 -7px 0 rgba(255, 172, 83, 0.35), inset 0 7px 12px rgba(255, 255, 255, 0.74);
      color: #5a4167;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      font-family: inherit;
      font-size: clamp(0.82rem, 3.8vw, 1rem);
      font-weight: 900;
      justify-content: center;
      max-width: 104px;
      min-height: 0;
      padding: 8px 4px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 90ms ease, box-shadow 90ms ease;
      width: 100%;
    }

    button:nth-child(2) {
      background: radial-gradient(circle at 34% 26%, #fffdf2 0 18%, #baf4c9 19% 68%, #69df9a 69% 100%);
      box-shadow: 0 9px 18px rgba(94, 68, 111, 0.18), inset 0 -7px 0 rgba(63, 183, 113, 0.28), inset 0 7px 12px rgba(255, 255, 255, 0.74);
    }

    button:nth-child(3) {
      background: radial-gradient(circle at 34% 26%, #fffdf2 0 18%, #bdeaff 19% 68%, #79cfff 69% 100%);
      box-shadow: 0 9px 18px rgba(94, 68, 111, 0.18), inset 0 -7px 0 rgba(69, 159, 219, 0.26), inset 0 7px 12px rgba(255, 255, 255, 0.74);
    }

    button:active {
      box-shadow: 0 4px 10px rgba(94, 68, 111, 0.16), inset 0 -3px 0 rgba(120, 90, 140, 0.16), inset 0 6px 10px rgba(255, 255, 255, 0.62);
      transform: translateY(5px) scale(0.98);
    }

    .icon {
      display: block;
      font-size: 1.68rem;
      line-height: 1;
      margin-bottom: 3px;
    }

    .info {
      background: rgba(255, 255, 255, 0.86);
      border: 3px dashed #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 18px rgba(94, 68, 111, 0.1);
      color: var(--muted);
      font-size: clamp(0.76rem, 3.2vw, 0.9rem);
      font-weight: 900;
      line-height: 1.45;
      margin: 12px auto 0;
      max-width: 540px;
      padding: 8px 12px;
      width: 100%;
    }

    .food-fly {
      animation: foodFly 820ms ease-in forwards;
      font-size: 2.8rem;
      left: 50%;
      pointer-events: none;
      position: absolute;
      top: 72%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .eat-pop {
      animation: eatPop 540ms ease;
    }

    .learning-panel {
      align-items: center;
      background: rgba(255, 232, 243, 0.72);
      display: none;
      inset: 0;
      justify-content: center;
      padding: 18px;
      position: fixed;
      z-index: 20;
    }

    .learning-panel.is-open {
      display: flex;
    }

    .learning-card {
      background: rgba(255, 255, 255, 0.98);
      border: 4px solid #fff;
      border-radius: 28px;
      box-shadow: 0 18px 38px rgba(94, 68, 111, 0.24);
      color: var(--ink);
      display: grid;
      gap: 14px;
      max-width: 430px;
      padding: 18px;
      width: 100%;
    }

    .learning-title {
      color: var(--pink-deep);
      font-size: 1.35rem;
      font-weight: 900;
      margin: 0;
    }

    .learning-help {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 900;
      line-height: 1.45;
      margin: 0;
    }

    .food-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, 1fr);
    }

    .food-grid.is-hidden {
      display: none;
    }

    .food-option,
    .trace-close {
      aspect-ratio: auto;
      border-radius: 22px;
      max-width: none;
      min-height: 86px;
      width: 100%;
    }

    .food-option {
      background: linear-gradient(180deg, #fffdf6, #fff0f8);
      border: 4px solid #ffe1ee;
      box-shadow: 0 8px 18px rgba(94, 68, 111, 0.13), inset 0 5px 10px rgba(255,255,255,0.8);
      color: #684777;
    }

    .food-option .food-icon {
      display: block;
      font-size: 2rem;
      line-height: 1;
      margin-bottom: 5px;
    }

    .trace-box {
      background: #fff8fc;
      border: 3px dashed #ffc0dc;
      border-radius: 22px;
      display: none;
      gap: 12px;
      padding: 14px;
    }

    .trace-box.is-open {
      display: grid;
    }

    .trace-word {
      display: flex;
      gap: 4px;
      justify-content: center;
      touch-action: none;
      user-select: none;
    }

    .trace-letter {
      align-items: center;
      background: #fff;
      border: 3px solid #ead7f4;
      border-radius: 18px;
      color: rgba(239, 94, 157, 0.32);
      display: flex;
      font-size: clamp(2.15rem, 12vw, 3.25rem);
      font-weight: 900;
      height: clamp(58px, 17vw, 78px);
      justify-content: center;
      line-height: 1;
      width: clamp(42px, 13vw, 58px);
    }

    .trace-letter.done {
      background: #ffe8f3;
      border-color: #ff9ac5;
      color: var(--pink-deep);
      transform: translateY(-3px);
    }

    .trace-progress {
      background: #f0e8f7;
      border: 2px solid #fff;
      border-radius: 999px;
      height: 16px;
      overflow: hidden;
    }

    .trace-progress-fill {
      background: linear-gradient(90deg, #ffc0dc, #ff7db6);
      border-radius: inherit;
      height: 100%;
      transition: width 160ms ease;
      width: 0%;
    }


    .trace-status {
      align-items: center;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .trace-badge {
      align-items: center;
      background: #72d7ff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(94, 68, 111, 0.12);
      color: #fff;
      display: inline-flex;
      font-size: 1.1rem;
      font-weight: 900;
      height: 40px;
      justify-content: center;
      width: 40px;
    }

    .trace-count {
      color: #7b6b86;
      font-size: 1.35rem;
      font-weight: 900;
    }

    .trace-board {
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(103, 193, 236, 0.36) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(180deg, transparent calc(50% - 1px), rgba(103, 193, 236, 0.36) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
        #e9fbff;
      border: 4px solid #aee8ff;
      border-radius: 18px;
      height: min(74vw, 320px);
      margin: 0 auto;
      max-height: 320px;
      overflow: hidden;
      position: relative;
      touch-action: none;
      user-select: none;
      width: min(100%, 320px);
    }

    .trace-big-letter {
      color: transparent;
      font-size: min(58vw, 240px);
      font-weight: 900;
      inset: 0;
      line-height: 1.1;
      opacity: 0.72;
      paint-order: stroke fill;
      pointer-events: none;
      position: absolute;
      -webkit-text-stroke: 8px rgba(95, 80, 108, 0.34);
      text-stroke: 8px rgba(95, 80, 108, 0.34);
    }

    .trace-dot {
      align-items: center;
      background: #ffcf24;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 3px 7px rgba(94, 68, 111, 0.16);
      color: #fff;
      display: flex;
      font-size: 0.9rem;
      font-weight: 900;
      height: 28px;
      justify-content: center;
      pointer-events: none;
      position: absolute;
      transform: translate(-50%, -50%);
      width: 28px;
      z-index: 4;
    }

    .trace-line-layer {
      inset: 0;
      pointer-events: none;
      position: absolute;
      z-index: 1;
    }

    .trace-line-layer path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .guide-stroke {
      stroke: rgba(95, 80, 108, 0.22);
      stroke-width: 13;
    }

    .guide-stroke.is-current {
      stroke: rgba(85, 177, 235, 0.58);
      stroke-width: 17;
    }

    .guide-stroke.is-done {
      stroke: rgba(123, 221, 47, 0.45);
      stroke-width: 15;
    }

    .drawn-stroke {
      stroke: #3f3449;
      stroke-width: 15;
    }

    .trace-word {
      display: none;
    }

    .trace-close {
      background: #eef9ff;
      border: 4px solid #fff;
      box-shadow: 0 8px 18px rgba(94, 68, 111, 0.12);
      color: #5a4167;
      min-height: 54px;
    }

    .online { color: #32805c; }
    .offline { color: #b16455; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-16px) scale(1.08); }
      68% { transform: translateY(4px) scale(0.98); }
    }

    @keyframes foodFly {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.8) rotate(-8deg); }
      28% { opacity: 1; transform: translate(-50%, -38px) scale(1.05) rotate(7deg); }
      72% { opacity: 1; transform: translate(-50%, -132px) scale(0.82) rotate(-5deg); }
      100% { opacity: 0; transform: translate(-50%, -158px) scale(0.22) rotate(8deg); }
    }

    @keyframes eatPop {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.12) rotate(-4deg); }
      58% { transform: scale(0.96) rotate(4deg); }
      78% { transform: scale(1.06); }
    }

    @media (min-width: 700px) {
      body {
        align-items: center;
        display: flex;
        justify-content: center;
      }

      main {
        box-shadow: 0 20px 60px rgba(94, 68, 111, 0.12);
        max-width: 540px;
      }
    }

    @media (max-width: 370px) {
      main {
        gap: 7px;
        grid-template-rows: auto minmax(340px, 1fr) auto auto;
        padding-left: 10px;
        padding-right: 10px;
      }

      .pet-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      .stats,
      .actions {
        gap: 6px;
      }

      .stat {
        padding-left: 5px;
        padding-right: 5px;
      }

      button {
        max-width: 92px;
      }

      .sticker.s3,
      .sticker.s4,
      .sticker.s5,
      .sticker.s6 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main aria-label="めいめいっちのゲーム">
    <header>
      <h1>めいめいっち</h1>
      <p class="subtitle">きょうも なかよく あそぼう</p>
    </header>

    <span class="sticker s1">✦</span>
    <span class="sticker s2">★</span>
    <span class="sticker s3">♡</span>
    <span class="sticker s4">♪</span>
    <span class="sticker s5">♥</span>
    <span class="sticker s6">✦</span>

    <section class="pet-area" aria-live="polite">
      <div class="stage-name" id="stageName">たまご</div>
      <div class="pet-wrap floaty" id="petWrap">
        <img class="pet-image" id="petImage" alt="めいめいっち">
        <div class="pet" id="petFace" aria-label="めいめいっち">🥚</div>
      </div>
      <p class="speech" id="message">こんにちは。なにしてあそぶ？</p>
    </section>

    <section class="stats" aria-label="めいめいっちのようす">
      <div class="stat">
        <div class="stat-top"><span>げんき</span><span id="energyText">80</span></div>
        <div class="meter"><div class="fill energy" id="energyBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-top"><span>おなか</span><span id="hungerText">80</span></div>
        <div class="meter"><div class="fill hunger" id="hungerBar"></div></div>
      </div>
      <div class="stat">
        <div class="stat-top"><span>ごきげん</span><span id="moodText">80</span></div>
        <div class="meter"><div class="fill mood" id="moodBar"></div></div>
      </div>
    </section>

    <section class="actions" aria-label="おせわボタン">
      <button type="button" data-action="feed"><span class="icon">🍙</span>ごはん</button>
      <button type="button" data-action="play"><span class="icon">🎈</span>あそぶ</button>
      <button type="button" data-action="sleep"><span class="icon">🌙</span>ねる</button>
    </section>

    <section class="info">
      <div>iPhoneのホーム画面に追加してね。</div>
      <div id="careGuide">あと 3かい おせわで せいちょうするよ。</div>
      <div id="networkState" class="online">オンラインです。オフラインでもあそべます。</div>
    </section>
  </main>

  <section class="learning-panel" id="foodPanel" aria-modal="true" aria-label="ごはんをえらぶ">
    <div class="learning-card">
      <p class="learning-title" id="foodTitle">どれを あげる？</p>
      <p class="learning-help" id="foodHelp">たべものの もじを なぞれたら あげられるよ。</p>
      <div class="food-grid" id="foodGrid"></div>
      <div class="trace-box" id="traceBox">
        <div class="trace-status">
          <span class="trace-badge" id="traceCurrent">1</span>
          <span class="trace-count" id="traceCount">/ 1</span>
        </div>
        <p class="learning-help" id="traceHelp">ゆびで もじを なぞってね。</p>
        <div class="trace-board" id="traceBoard" aria-label="もじをなぞる">
          <div class="trace-big-letter" id="traceBigLetter">あ</div>
          <svg class="trace-line-layer" id="traceLineLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="traceDots"></div>
        </div>
        <div class="trace-word" id="traceWord" aria-hidden="true"></div>
        <div class="trace-progress"><div class="trace-progress-fill" id="traceProgress"></div></div>
      </div>
      <button type="button" class="trace-close" id="foodClose">やめる</button>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "meimeicchi-state-v1";
    const defaultState = {
      energy: 80,
      hunger: 80,
      mood: 80,
      stage: "egg",
      careCount: 0,
      lastPlayed: Date.now()
    };

    const stages = {
      egg: {
        name: "たまご",
        emoji: "🥚",
        image: "assets/egg.png",
        next: 3
      },
      baby: {
        name: "あかちゃん",
        emoji: "🐣",
        image: "assets/baby.png",
        next: 10
      },
      child: {
        name: "こども",
        emoji: "😊",
        image: "assets/child.png",
        next: 20
      },
      adult: {
        name: "おとな",
        emoji: "🥰",
        image: "assets/adult.png",
        next: null
      }
    };

    const moodFaces = {
      egg: {
        happy: "🥚",
        hungry: "🥚",
        tired: "🥚",
        sad: "🥚",
        great: "🥚"
      },
      baby: {
        happy: "🐣",
        hungry: "🥺",
        tired: "😴",
        sad: "😢",
        great: "🥰"
      },
      child: {
        happy: "😊",
        hungry: "🥺",
        tired: "😴",
        sad: "😢",
        great: "🥰"
      },
      adult: {
        happy: "😄",
        hungry: "🥺",
        tired: "😴",
        sad: "😢",
        great: "🤩"
      }
    };

    const messages = {
      feed: "もぐもぐ。おいしいね。",
      chocolate: "チョコレート、ぱくっ。あまくて にこにこ。",
      play: "きゃっきゃっ。たのしいね。",
      sleep: "すやすや。げんきになったよ。",
      hungry: "おなかが すいたよ。",
      tired: "ちょっと ねむいよ。",
      sad: "なでなで してほしいな。",
      great: "とっても うれしいよ。",
      hello: "こんにちは。なにしてあそぶ？",
      grown: "めいめいっちが成長した！"
    };

    const elements = {
      face: document.querySelector("#petFace"),
      image: document.querySelector("#petImage"),
      petWrap: document.querySelector("#petWrap"),
      stageName: document.querySelector("#stageName"),
      message: document.querySelector("#message"),
      energyText: document.querySelector("#energyText"),
      hungerText: document.querySelector("#hungerText"),
      moodText: document.querySelector("#moodText"),
      energyBar: document.querySelector("#energyBar"),
      hungerBar: document.querySelector("#hungerBar"),
      moodBar: document.querySelector("#moodBar"),
      careGuide: document.querySelector("#careGuide"),
      networkState: document.querySelector("#networkState"),
      foodPanel: document.querySelector("#foodPanel"),
      foodGrid: document.querySelector("#foodGrid"),
      foodTitle: document.querySelector("#foodTitle"),
      foodHelp: document.querySelector("#foodHelp"),
      traceBox: document.querySelector("#traceBox"),
      traceWord: document.querySelector("#traceWord"),
      traceHelp: document.querySelector("#traceHelp"),
      traceBoard: document.querySelector("#traceBoard"),
      traceBigLetter: document.querySelector("#traceBigLetter"),
      traceLineLayer: document.querySelector("#traceLineLayer"),
      traceDots: document.querySelector("#traceDots"),
      traceCurrent: document.querySelector("#traceCurrent"),
      traceCount: document.querySelector("#traceCount"),
      traceProgress: document.querySelector("#traceProgress"),
      foodClose: document.querySelector("#foodClose")
    };

    const foods = [
      { id: "rice", name: "おにぎり", icon: "🍙", traceWord: "おにぎり", message: "おにぎり、もぐもぐ。" },
      { id: "apple", name: "りんご", icon: "🍎", traceWord: "りんご", message: "りんご、しゃくしゃく。" },
      { id: "chocolate", name: "チョコレート", icon: "🍫", traceWord: "チョコレート", message: messages.chocolate }
    ];

    let traceTarget = null;
    let traceLetterIndex = 0;
    let traceStrokeIndex = 0;
    let tracePointIndex = 0;
    let isTracing = false;
    let currentPath = null;
    let state = loadState();

    function clamp(value) {
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) {
          return { ...defaultState };
        }

        const hoursAway = Math.min(24, Math.max(0, (Date.now() - saved.lastPlayed) / 3600000));
        return {
          energy: clamp(saved.energy - hoursAway * 2),
          hunger: clamp(saved.hunger - hoursAway * 3),
          mood: clamp(saved.mood - hoursAway * 2),
          stage: getStageForCareCount(saved.careCount || 0),
          careCount: saved.careCount || 0,
          lastPlayed: Date.now()
        };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, lastPlayed: Date.now() }));
    }

    function getStageForCareCount(careCount) {
      if (careCount >= 20) return "adult";
      if (careCount >= 10) return "child";
      if (careCount >= 3) return "baby";
      return "egg";
    }

    function updateStage() {
      const nextStage = getStageForCareCount(state.careCount);
      const grew = nextStage !== state.stage;
      state.stage = nextStage;
      return grew;
    }

    function getMood() {
      if (state.hunger < 25) return "hungry";
      if (state.energy < 25) return "tired";
      if (state.mood < 25) return "sad";
      if (state.energy > 75 && state.hunger > 75 && state.mood > 75) return "great";
      return "happy";
    }

    function render(customMessage) {
      const mood = getMood();
      const stage = stages[state.stage] || stages.egg;
      elements.stageName.textContent = stage.name;
      elements.face.textContent = (moodFaces[state.stage] || moodFaces.egg)[mood] || stage.emoji;
      elements.message.textContent = customMessage || messages[mood] || messages.hello;
      elements.petWrap.classList.remove("has-image");
      elements.image.onload = () => {
        elements.petWrap.classList.add("has-image");
      };
      elements.image.onerror = () => {
        elements.petWrap.classList.remove("has-image");
      };
      elements.image.src = stage.image;

      elements.energyText.textContent = state.energy;
      elements.hungerText.textContent = state.hunger;
      elements.moodText.textContent = state.mood;
      elements.energyBar.style.width = `${state.energy}%`;
      elements.hungerBar.style.width = `${state.hunger}%`;
      elements.moodBar.style.width = `${state.mood}%`;
      elements.careGuide.textContent = getCareGuideText(stage);
    }

    function getCareGuideText(stage) {
      if (stage.next === null) {
        return `おせわ ${state.careCount}かい。りっぱな おとなだよ。`;
      }

      return `あと ${stage.next - state.careCount}かい おせわで せいちょうするよ。`;
    }

    function bouncePet() {
      elements.petWrap.classList.remove("bounce");
      void elements.petWrap.offsetWidth;
      elements.petWrap.classList.add("bounce");
    }

    function doAction(action, customMessage) {
      if (action === "feed") {
        state.hunger = clamp(state.hunger + 24);
        state.energy = clamp(state.energy + 4);
        state.mood = clamp(state.mood + 6);
      }

      if (action === "play") {
        state.mood = clamp(state.mood + 24);
        state.energy = clamp(state.energy - 12);
        state.hunger = clamp(state.hunger - 10);
      }

      if (action === "sleep") {
        state.energy = clamp(state.energy + 28);
        state.hunger = clamp(state.hunger - 8);
        state.mood = clamp(state.mood + 4);
      }

      state.careCount += 1;
      const grew = updateStage();
      saveState();
      render(grew ? messages.grown : (customMessage || messages[action]));
      bouncePet();
    }


    function openFoodMenu() {
      elements.foodPanel.classList.add("is-open");
      elements.traceBox.classList.remove("is-open");
      elements.foodGrid.classList.remove("is-hidden");
      elements.foodTitle.textContent = "どれを あげる？";
      elements.foodHelp.textContent = "たべものの もじを なぞれたら あげられるよ。";
      elements.traceProgress.style.width = "0%";
      traceTarget = null;
      traceLetterIndex = 0;
      traceStrokeIndex = 0;
      tracePointIndex = 0;
      isTracing = false;
      currentPath = null;
      renderFoodOptions();
    }

    function closeFoodMenu() {
      elements.foodPanel.classList.remove("is-open");
      isTracing = false;
    }

    function renderFoodOptions() {
      elements.foodGrid.innerHTML = "";
      foods.forEach((food) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "food-option";
        button.innerHTML = `<span class="food-icon">${food.icon}</span>${food.name}`;
        button.addEventListener("click", () => chooseFood(food));
        elements.foodGrid.appendChild(button);
      });
    }

    function chooseFood(food) {
      startTrace(food);
    }

    function startTrace(food) {
      traceTarget = food;
      traceLetterIndex = 0;
      traceStrokeIndex = 0;
      tracePointIndex = 0;
      isTracing = false;
      currentPath = null;
      elements.foodTitle.textContent = `${food.name}を なぞろう`;
      elements.foodHelp.textContent = "ゆっくりで だいじょうぶ。ひとつずつ なぞってね。";
      elements.foodGrid.classList.add("is-hidden");
      elements.traceBox.classList.add("is-open");
      elements.traceWord.innerHTML = "";
      elements.traceProgress.style.width = "0%";
      showTraceLetter();
    }

    function getTraceStrokes(letter) {
      const maps = {
        "お": [
          [[28, 34], [70, 34]],
          [[48, 22], [48, 44], [36, 58], [38, 72], [54, 76], [67, 66]],
          [[64, 30], [76, 40], [74, 54]]
        ],
        "に": [
          [[32, 24], [28, 46], [30, 72]],
          [[50, 34], [72, 34]],
          [[48, 66], [74, 66]]
        ],
        "ぎ": [
          [[27, 30], [68, 27]],
          [[31, 43], [74, 40]],
          [[48, 23], [55, 45], [45, 64], [56, 78]],
          [[71, 23], [76, 29]],
          [[80, 34], [85, 40]]
        ],
        "り": [
          [[38, 24], [36, 56]],
          [[64, 22], [65, 45], [55, 72]]
        ],
        "ん": [
          [[30, 72], [42, 48], [55, 28], [58, 58], [72, 64]]
        ],
        "ご": [
          [[30, 36], [68, 36]],
          [[38, 66], [70, 66]],
          [[73, 26], [78, 32]],
          [[81, 38], [86, 44]]
        ],
        "チ": [
          [[36, 25], [63, 32]],
          [[29, 48], [75, 48]],
          [[54, 30], [52, 54], [42, 75]]
        ],
        "ョ": [
          [[36, 40], [66, 40]],
          [[66, 40], [66, 64]],
          [[38, 64], [66, 64]]
        ],
        "コ": [
          [[32, 34], [70, 34], [70, 66]],
          [[32, 66], [70, 66]]
        ],
        "レ": [
          [[38, 26], [38, 72], [68, 54]]
        ],
        "ー": [
          [[28, 50], [72, 50]]
        ],
        "ト": [
          [[38, 24], [38, 76]],
          [[40, 42], [72, 60]]
        ]
      };

      return maps[letter] || [[[30, 30], [70, 30], [50, 52], [32, 72], [70, 72]]];
    }

    function pointsToPath(points) {
      return points.map(([x, y], index) => `${index === 0 ? "M" : "L"} ${x} ${y}`).join(" ");
    }

    function showTraceLetter() {
      const letters = [...traceTarget.traceWord];
      const letter = letters[traceLetterIndex];
      traceStrokeIndex = 0;
      tracePointIndex = 0;
      currentPath = null;
      elements.traceBigLetter.textContent = letter;
      elements.traceCurrent.textContent = traceLetterIndex + 1;
      elements.traceCount.textContent = `/ ${letters.length}`;
      elements.traceHelp.textContent = `「${letter}」の 1かくめを なぞってね。`;
      elements.traceBoard.setAttribute("aria-label", `${letter}をなぞる`);
      renderTraceGuide();
      updateTraceProgress();
    }

    function renderTraceGuide() {
      const letter = [...traceTarget.traceWord][traceLetterIndex];
      const strokes = getTraceStrokes(letter);
      elements.traceLineLayer.innerHTML = "";
      elements.traceDots.innerHTML = "";

      strokes.forEach((stroke, index) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", pointsToPath(stroke));
        path.classList.add("guide-stroke");
        if (index < traceStrokeIndex) path.classList.add("is-done");
        if (index === traceStrokeIndex) path.classList.add("is-current");
        elements.traceLineLayer.appendChild(path);
      });

      const currentStroke = strokes[traceStrokeIndex];
      const [startX, startY] = currentStroke[0];
      const dot = document.createElement("div");
      dot.className = "trace-dot";
      dot.style.left = `${startX}%`;
      dot.style.top = `${startY}%`;
      dot.textContent = traceStrokeIndex + 1;
      elements.traceDots.appendChild(dot);
    }

    function handleTracePoint(clientX, clientY) {
      if (!traceTarget) return;
      const strokes = getTraceStrokes([...traceTarget.traceWord][traceLetterIndex]);
      const stroke = strokes[traceStrokeIndex];
      const boardRect = elements.traceBoard.getBoundingClientRect();
      const x = ((clientX - boardRect.left) / boardRect.width) * 100;
      const y = ((clientY - boardRect.top) / boardRect.height) * 100;
      const [targetX, targetY] = stroke[tracePointIndex];
      const distance = Math.hypot(x - targetX, y - targetY);

      if (distance > 15) return;

      appendTraceLine(x, y);
      tracePointIndex += 1;

      if (tracePointIndex >= stroke.length) {
        finishTraceStroke();
      }
    }

    function appendTraceLine(x, y) {
      if (!currentPath) {
        currentPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        currentPath.classList.add("drawn-stroke");
        currentPath.setAttribute("d", `M ${x} ${y}`);
        elements.traceLineLayer.appendChild(currentPath);
        return;
      }

      currentPath.setAttribute("d", `${currentPath.getAttribute("d")} L ${x} ${y}`);
    }

    function finishTraceStroke() {
      const strokes = getTraceStrokes([...traceTarget.traceWord][traceLetterIndex]);
      traceStrokeIndex += 1;
      tracePointIndex = 0;
      currentPath = null;
      isTracing = false;

      if (traceStrokeIndex >= strokes.length) {
        finishTraceLetter();
        return;
      }

      elements.traceHelp.textContent = `「${[...traceTarget.traceWord][traceLetterIndex]}」の ${traceStrokeIndex + 1}かくめを なぞってね。`;
      renderTraceGuide();
    }

    function finishTraceLetter() {
      const letters = [...traceTarget.traceWord];
      traceLetterIndex += 1;
      updateTraceProgress();

      if (traceLetterIndex >= letters.length) {
        const food = traceTarget;
        traceTarget = null;
        isTracing = false;
        setTimeout(() => giveFood(food), 360);
        return;
      }

      setTimeout(showTraceLetter, 360);
    }

    function updateTraceProgress() {
      if (!traceTarget) return;
      const total = [...traceTarget.traceWord].length;
      elements.traceProgress.style.width = `${(traceLetterIndex / total) * 100}%`;
    }

    function giveFood(food) {
      closeFoodMenu();
      animateEating(food.icon);
      doAction("feed", food.message);
    }

    function animateEating(icon) {
      const food = document.createElement("div");
      food.className = "food-fly";
      food.textContent = icon;
      document.querySelector(".pet-area").appendChild(food);
      elements.petWrap.classList.add("eat-pop");

      setTimeout(() => food.remove(), 900);
      setTimeout(() => elements.petWrap.classList.remove("eat-pop"), 620);
    }

    function updateNetworkState() {
      if (navigator.onLine) {
        elements.networkState.textContent = "オンラインです。オフラインでもあそべます。";
        elements.networkState.className = "online";
      } else {
        elements.networkState.textContent = "オフラインです。このままあそべます。";
        elements.networkState.className = "offline";
      }
    }

    document.querySelectorAll("button[data-action]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.action === "feed") {
          openFoodMenu();
          return;
        }

        doAction(button.dataset.action);
      });
    });

    elements.foodClose.addEventListener("click", closeFoodMenu);
    elements.foodPanel.addEventListener("click", (event) => {
      if (event.target === elements.foodPanel) {
        closeFoodMenu();
      }
    });
    elements.traceBoard.addEventListener("pointerdown", (event) => {
      isTracing = true;
      currentPath = null;
      elements.traceBoard.setPointerCapture(event.pointerId);
      handleTracePoint(event.clientX, event.clientY);
    });
    elements.traceBoard.addEventListener("pointermove", (event) => {
      if (isTracing) {
        handleTracePoint(event.clientX, event.clientY);
      }
    });
    elements.traceBoard.addEventListener("pointerup", () => {
      isTracing = false;
    });
    elements.traceBoard.addEventListener("pointercancel", () => {
      isTracing = false;
    });

    elements.petWrap.addEventListener("animationend", (event) => {
      if (event.animationName === "bounce") {
        elements.petWrap.classList.remove("bounce");
      }
    });

    window.addEventListener("online", updateNetworkState);
    window.addEventListener("offline", updateNetworkState);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }

    render(messages.hello);
    saveState();
    updateNetworkState();
  </script>
</body>
</html>
